name: ci
run-name: ci
env:
  NODE_VERSION: 18
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: npm ci
        run: npm ci

      - name: npm lint
        run: npm lint


  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        node-version: [18,20,22]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
      
    - name: npm ci
      run: npm ci

    - name: Tests (Node ${{ matrix.node-version }})
      run: npm test

  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
      
    - name: npm ci
      run: npm ci

    - name: npm run build
      run: npm run build
