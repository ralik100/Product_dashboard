name: ci
run-name: ci
env:
  NODE_VERSION: 20
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      
      - name: npm ci
        run: npm ci

      - name: npm lint
        run: npm run lint


  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        node-version: [18,20,22]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
      
    - name: npm ci
      run: npm ci

    - name: Tests (Node ${{ matrix.node-version }})
      run: npm run test

    - name: Generate test report
      run: |
        mkdir -p reports
        echo "Tests passed on Node ${{ matrix.node-version }}" > reports/test-report.txt
      if: matrix.node-version == 20

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: matrix.node-version == 20
      with:
        name: tests-results
        path: ./reports/test-report.txt
        retention-days: 10

  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
      
    - name: npm ci
      run: npm ci

    - name: npm run build
      run: npm run build
  
  add_summary:
    runs-on: ubuntu-latest
    needs: build

    steps:

    - name: Add summary
      run: |
        echo "Lint passed" >> $GITHUB_STEP_SUMMARY
        echo "Tests passed" >> $GITHUB_STEP_SUMMARY
        echo "Build passed" >> $GITHUB_STEP_SUMMARY
        echo "Node version: ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY